# Local development services. Production uses Neon (Postgres) — see docs/DEPLOYMENT.md.
# Usage: docker compose up -d   →   Postgres on localhost:5432
services:
  postgres:
    image: postgres:16-alpine
    container_name: tournament_postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: tournament
      POSTGRES_PASSWORD: tournament
      POSTGRES_DB: tournament
    ports:
      - "5432:5432"
    volumes:
      - tournament_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U tournament"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  tournament_pgdata:

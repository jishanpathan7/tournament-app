name: CI

# Gates every PR into main (and pushes to main) with the same quality checks
# we run locally: API lint/type/tests against a real Postgres, Web lint/type/build.

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

# One in-flight run per ref; new pushes cancel stale runs.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  api:
    name: API · lint · types · tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/api
    # Throwaway Postgres 16 (>=15 required by the schema: NULLS NOT DISTINCT,
    # native enums, FORCE RLS). POSTGRES_USER is a superuser, matching local.
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: tournament
          POSTGRES_PASSWORD: tournament
          POSTGRES_DB: tournament
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U tournament -d tournament"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql+asyncpg://tournament:tournament@localhost:5432/tournament
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: apps/api/requirements.txt
      - name: Install dependencies
        run: pip install -r requirements.txt
      - name: Format check (black)
        run: black --check .
      - name: Import order (isort)
        run: isort --check-only .
      - name: Lint (flake8)
        run: flake8
      - name: Type check (mypy)
        run: mypy app
      - name: Tests (pytest)
        # conftest autouse-migrates to head; test_migrations round-trips 0001+0002.
        run: pytest

  web:
    name: Web · lint · types · test · build
    runs-on: ubuntu-latest
    # Provide build-time env vars so Next.js bakes real-looking values into the
    # bundle instead of the localhost fallbacks from env.ts.
    env:
      NEXT_PUBLIC_API_URL: ""
      NEXT_PUBLIC_APP_URL: "https://example.playlane.app"
      # Empty DSN — Sentry is disabled in CI but the env var must exist so the
      # build does not fall back to undefined-check warnings.
      NEXT_PUBLIC_SENTRY_DSN: ""
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: yarn
      - name: Install dependencies
        run: yarn install --frozen-lockfile
      - name: Lint
        run: yarn lint
      - name: Type check
        run: yarn typecheck
      - name: Test
        run: yarn test
      - name: Build
        run: yarn build

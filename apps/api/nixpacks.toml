# nixpacks build configuration for the Playlane API.
#
# Python version is pinned via .python-version (3.13).
# nixpacks auto-detects Python + pip from that file and requirements.txt.
# We only override the start command — everything else is auto-configured.

[start]
cmd = "uvicorn app.main:app --host 0.0.0.0 --port $PORT --workers 1"

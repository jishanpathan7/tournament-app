# nixpacks build configuration for the Playlane API.
# Railway uses nixpacks to build the Python app image.
#
# python313 puts the interpreter on PATH as "python3" (not "python").
# gcc is needed for C-extension packages (asyncpg, cryptography, argon2-cffi).

[phases.setup]
nixPkgs = ["python313", "gcc"]

[phases.install]
cmds = ["python3 -m pip install --upgrade pip", "python3 -m pip install -r requirements.txt"]

[start]
cmd = "uvicorn app.main:app --host 0.0.0.0 --port $PORT --workers 1"

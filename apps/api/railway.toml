# Railway deployment configuration for the Playlane API (FastAPI).
# https://docs.railway.com/reference/config-as-code

[build]
builder = "nixpacks"

[deploy]
# Migrations run at app startup (see app/main.py's lifespan), not as a
# preDeployCommand — pre-deploy executes in a temporary build container with
# no route to the private network, so `alembic upgrade head` failed there
# with "Network is unreachable" against Supabase. Running migrations after
# the app boots guarantees network access; migrations/env.py still targets
# DIRECT_URL for a direct (non-pooled) connection.

# Railway injects $PORT automatically. The app must bind to 0.0.0.0:$PORT.
startCommand = "uvicorn app.main:app --host 0.0.0.0 --port $PORT --workers 1"

# Health check — Railway waits for this to return 200 before routing traffic.
healthcheckPath = "/api/v1/health"
healthcheckTimeout = 30       # seconds

# Restart on non-zero exit; give up after 3 consecutive failures.
restartPolicyType = "on_failure"
restartPolicyMaxRetries = 3

# Railway deployment configuration for the Playlane API (FastAPI).
# https://docs.railway.com/reference/config-as-code

[build]
builder = "nixpacks"

[deploy]
# Schema first, then traffic. Without this, code shipped ahead of its migration
# and the first request touching a new column returned a 500 — which is exactly
# how `teams.squad_id` reached production missing. Railway runs this in the app's
# own environment (private network reachable, native libs loaded), which a
# `railway ssh` shell does not get.
preDeployCommand = "python3 -c \"import os; u=os.environ.get('DIRECT_URL',''); print('DIRECT_URL host:', u.split('@')[-1].split('/')[0] if u else 'NOT SET')\" && alembic upgrade head"

# Railway injects $PORT automatically. The app must bind to 0.0.0.0:$PORT.
startCommand = "uvicorn app.main:app --host 0.0.0.0 --port $PORT --workers 1"

# Health check — Railway waits for this to return 200 before routing traffic.
healthcheckPath = "/api/v1/health"
healthcheckTimeout = 30       # seconds

# Restart on non-zero exit; give up after 3 consecutive failures.
restartPolicyType = "on_failure"
restartPolicyMaxRetries = 3

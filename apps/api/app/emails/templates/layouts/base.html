<!DOCTYPE html>
<html xmlns="http://www.w3.org/1999/xhtml" lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta http-equiv="X-UA-Compatible" content="IE=edge">
  <meta name="color-scheme" content="light">
  <meta name="supported-color-schemes" content="light">
  <!--[if !mso]><!-->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,600;9..144,700&family=Instrument+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
  <!--<![endif]-->
  <style>
    /* Reset */
    body,table,td,a{-webkit-text-size-adjust:100%;-ms-text-size-adjust:100%}
    table,td{mso-table-lspace:0pt;mso-table-rspace:0pt}
    img{-ms-interpolation-mode:bicubic;border:0;outline:none;text-decoration:none;display:block}
    body{margin:0;padding:0;background-color:#FFFDF5}
    a{color:#8B5CF6}

    /* Responsive */
    @media only screen and (max-width:620px){
      .email-outer{padding:20px 12px!important}
      .email-card{padding:28px 24px!important;border-radius:16px!important}
      .email-logo-cell{padding-bottom:20px!important}
      .email-footer-cell{padding-top:20px!important}
      .btn-link{padding:13px 28px!important;font-size:14px!important}
    }
  </style>
</head>
<body style="margin:0;padding:0;background-color:#FFFDF5;font-family:'Instrument Sans',ui-sans-serif,system-ui,-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif;-webkit-font-smoothing:antialiased;">

  <!-- Preheader (hidden preview text) -->
  <div style="display:none;font-size:1px;color:#FFFDF5;line-height:1px;max-height:0;max-width:0;opacity:0;overflow:hidden;">{% block preheader %}{{ app_name }}{% endblock %}&zwnj;&nbsp;&zwnj;&nbsp;&zwnj;&nbsp;&zwnj;&nbsp;</div>

  <!-- Outer wrapper -->
  <table role="presentation" width="100%" cellpadding="0" cellspacing="0" border="0" class="email-outer" style="background-color:#FFFDF5;padding:44px 20px;">
    <tr>
      <td align="center">

        <!-- Max-width container -->
        <table role="presentation" width="100%" style="max-width:560px;" cellpadding="0" cellspacing="0" border="0">

          <!-- ─── Wordmark ─── -->
          <tr>
            <td align="center" class="email-logo-cell" style="padding-bottom:24px;">
              <a href="{{ frontend_url }}" style="text-decoration:none;display:inline-block;">
                <span style="font-family:Fraunces,Georgia,'Times New Roman',serif;font-size:24px;font-weight:700;color:#1E293B;letter-spacing:-0.025em;">Playlane</span>
              </a>
            </td>
          </tr>

          <!-- ─── Card ─── -->
          <tr>
            <td class="email-card" style="background:#FFFFFF;border:2px solid #1E293B;border-top:5px solid {% block accent_color %}#8B5CF6{% endblock %};border-radius:20px;padding:36px 40px 40px;box-shadow:5px 5px 0 0 #1E293B;mso-border-alt:none;">
              {% block content %}{% endblock %}
            </td>
          </tr>

          <!-- ─── Footer ─── -->
          <tr>
            <td align="center" class="email-footer-cell" style="padding-top:28px;">
              <p style="margin:0 0 6px;font-family:'Courier New',Courier,ui-monospace,monospace;font-size:10px;font-weight:600;color:#94A3B8;letter-spacing:0.07em;text-transform:uppercase;">Sent by {{ app_name }}</p>
              <p style="margin:0;font-family:'Courier New',Courier,ui-monospace,monospace;font-size:10px;color:#CBD5E1;letter-spacing:0.05em;text-transform:uppercase;">If you didn't expect this, you can safely ignore it.</p>
            </td>
          </tr>

        </table>
      </td>
    </tr>
  </table>

</body>
</html>

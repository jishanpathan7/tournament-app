<!doctype html>
<html lang="en">
  <body style="margin:0;background:#f6f7f9;font-family:Arial,Helvetica,sans-serif;color:#1a1a1a">
    <div style="max-width:560px;margin:0 auto;padding:24px">
      <div style="background:#ffffff;border-radius:12px;padding:32px">
        <div style="display:flex;align-items:center;gap:10px;margin:0 0 24px 0">
          <div style="display:inline-flex;align-items:center;justify-content:center;width:36px;height:36px;background:#8B5CF6;border-radius:10px;border:2px solid #1E293B;flex-shrink:0">
            <img src="{{ frontend_url }}/logo-mark.png" alt="" width="22" height="22" style="filter:brightness(0) invert(1);display:block" />
          </div>
          <span style="font-size:20px;font-weight:700;color:#1a1a1a;letter-spacing:-0.3px">{{ app_name }}</span>
        </div>
        {% block content %}{% endblock %}
      </div>
      <p style="color:#8a8a8a;font-size:12px;text-align:center;margin-top:16px">
        Sent by {{ app_name }}. If you didn't expect this email, you can safely ignore it.
      </p>
    </div>
  </body>
</html>

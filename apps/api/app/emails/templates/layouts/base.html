<!doctype html>
<html lang="en">
  <body style="margin:0;background:#f6f7f9;font-family:Arial,Helvetica,sans-serif;color:#1a1a1a">
    <div style="max-width:560px;margin:0 auto;padding:24px">
      <div style="background:#ffffff;border-radius:12px;padding:32px">
        <h1 style="font-size:20px;margin:0 0 16px 0">{{ app_name }}</h1>
        {% block content %}{% endblock %}
      </div>
      <p style="color:#8a8a8a;font-size:12px;text-align:center;margin-top:16px">
        Sent by {{ app_name }}. If you didn't expect this email, you can safely ignore it.
      </p>
    </div>
  </body>
</html>
